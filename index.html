<style>
/* Layout: one infinite dark canvas; every case study is a node wired in talk order; the camera flies between them. */
:root {
  --ground: #232428;
  --ground-2: #1d1e21;
  --card: #2B2C31;
  --card-line: #37383D;
  --ink: #E9E9EB;
  --ink-2: #B4B6BC;

  --wire: rgba(233, 233, 235, .32);

  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--display); overflow: hidden; }
#viewport { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab;
  background:
    radial-gradient(circle at 30% 25%, rgba(56,57,62,.55), transparent 60%),
    radial-gradient(rgba(140,143,150,.22) 1.2px, transparent 1.3px) 0 0 / 36px 36px,
    var(--ground); }
#viewport.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#wires { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#wires path { fill: none; stroke: var(--wire); stroke-width: 3; transition: stroke .5s ease, stroke-width .5s ease, opacity .5s ease; }
#wires path.glow { stroke: var(--pale); stroke-width: 14; opacity: 0; filter: blur(8px); }
#wires path.flow { stroke: var(--pale); stroke-width: 4; stroke-dasharray: 2 26; stroke-linecap: round; opacity: 0; }
#wires g.hot path.base { stroke: var(--pale); stroke-width: 4; }
#wires g.hot path.glow { opacity: .35; }
#wires g.hot path.flow { opacity: 1; animation: wireflow 1.1s linear infinite; }
#wires circle { transition: stroke .5s ease, fill .5s ease; }
#wires circle.hot { fill: var(--pale); }
@keyframes wireflow { to { stroke-dashoffset: -28; } }
@media (prefers-reduced-motion: reduce) { #wires g.hot path.flow { animation: none; } }
#wires circle { fill: var(--ground); stroke: var(--pale); stroke-width: 3; }

.node { position: absolute; background: var(--card); border: 2px solid var(--card-line); border-radius: 22px;
  box-shadow: 0 30px 60px rgba(0,0,0,.45); cursor: pointer; transition: border-color .3s, box-shadow .3s; }
.node:hover { border-color: #4a4c55; }
.node.on { border-color: var(--pale); box-shadow: 0 0 0 6px rgba(169,203,242,.14), 0 40px 80px rgba(0,0,0,.55); cursor: default; }
.node-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 26px 0;
  font-family: var(--mono); font-size: 18px; letter-spacing: .06em; color: var(--pale); text-transform: uppercase; }
.node-head span:last-child { color: var(--ink-3); letter-spacing: .2em; }
.node-body { padding: 18px 26px 28px; display: grid; gap: 22px; }
.node h2 { font-weight: 400; font-size: 46px; line-height: 1.08; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.node p { margin: 0; font-size: 21px; line-height: 1.45; color: var(--ink-2); max-width: 62ch; }
.node .lede { color: var(--ink); }
.media { width: 100%; border-radius: 12px; display: block; background: #0c0c0d; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
.split { display: grid; grid-template-columns: 1.55fr 1fr; gap: 26px; align-items: start; }
.cap b { display: block; font-size: 22px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
.cap { font-size: 19px; color: var(--ink-2); line-height: 1.4; }
.label { font-family: var(--mono); font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--pale); }
.box { background: var(--ground-2); border: 1px solid var(--card-line); border-radius: 14px; padding: 20px 22px; display: grid; gap: 8px; }
.box p { font-size: 19px; color: var(--ink); }
.steps { display: grid; gap: 0; }
.steps > div { border-top: 1px solid var(--card-line); padding: 14px 0; display: grid; gap: 4px; }
.steps b { font-size: 21px; font-weight: 600; }
.steps span:not(.label) { font-size: 18px; color: var(--ink-2); line-height: 1.4; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.stat { border-top: 1px solid var(--card-line); padding-top: 12px; display: grid; gap: 6px; }
.stat strong { font-weight: 300; font-size: 50px; color: var(--pale); line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 18px; color: var(--ink-2); line-height: 1.35; }

/* The Machine flow */
.flow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; position: relative; padding-bottom: 56px; }
.flow > div { background: var(--ground-2); border: 1px solid var(--card-line); border-radius: 14px; padding: 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.flow b { font-size: 19px; font-weight: 600; line-height: 1.2; }
.flow span:not(.label) { font-size: 15px; color: var(--ink-2); line-height: 1.35; }
.flow .gate { background: var(--pale); border-color: var(--pale); }
.flow .gate .label, .flow .gate b, .flow .gate span { color: var(--pale-ink) !important; }
.flow .sign { background: var(--ink); border-color: var(--ink); }
.flow .sign .label, .flow .sign b, .flow .sign span { color: var(--pale-ink) !important; }
.loop { display: block; position: absolute; left: calc(2.5 * (100% - 70px) / 6 + 28px); width: calc((100% - 70px) / 6 + 14px); bottom: 6px; height: 34px;
  border: 2px solid var(--pale); border-top: none; border-radius: 0 0 12px 12px; }
.loop-txt { position: absolute; bottom: -26px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 14px; color: var(--pale); }

.gallery-img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 12px; display: block; }
.title-node h1 { font-weight: 300; font-size: 118px; line-height: .98; letter-spacing: -.02em; margin: 0; }
.title-node p { font-size: 26px; }
.title-node .mb { position: absolute; right: 26px; bottom: 24px; width: 60px; height: auto; display: block; margin: 0; }
.title-node .path { font-family: var(--mono); font-size: 17px; letter-spacing: .03em; color: var(--ink-3); line-height: 1.6; max-width: none; }
.hint { font-family: var(--mono); font-size: 18px; color: var(--pale); letter-spacing: .05em; }
.q { display: grid; grid-template-columns: 34px 1fr; border-top: 1px solid var(--card-line); padding: 14px 0; font-size: 24px; }
.q span { font-family: var(--mono); color: var(--pale); font-size: 18px; padding-top: 4px; }

.seg { display: grid; gap: 10px; }
.seg { min-width: 0; grid-template-columns: minmax(0, 1fr); }
.node-body > * { min-width: 0; }
.strip { display: flex; gap: 14px; width: 100%; }
.strip > * { flex: var(--ar) 1 0; min-width: 0; aspect-ratio: var(--ar); height: auto; width: auto; object-fit: cover; }
.strip > .mwrap { display: flex; } .strip > .mwrap video { width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; }

.split > *, .strip, .node-body > * { min-width: 0; }
.acc { font-family: var(--serif); font-weight: 700; letter-spacing: 0; }
.node h2 { font-weight: 500; text-transform: none; }
.node .label { color: var(--ink-3); }
.node-head { color: var(--ink-3); }
.intro { display: grid; grid-template-columns: 300px 1fr; gap: 36px; align-items: center; }
.headshot { width: 100%; aspect-ratio: 4/5; object-fit: cover; border-radius: 14px; display: block; filter: grayscale(.15); }
.title-node h1 { font-weight: 500; font-size: 68px; line-height: 1.04; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.title-node .tag { font-size: 24px; color: var(--ink-2); }
.cta { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.cta button, .btn { font: 500 16px var(--mono); letter-spacing: .02em; text-transform: none; color: var(--pale-ink); background: var(--ink); border: 1px solid var(--ink); border-radius: 999px; padding: 12px 20px; text-decoration: none; cursor: pointer; }
.btn:hover, .cta button:hover { background: transparent; color: var(--ink); }
.mono-mail, .tools { font-family: var(--mono); font-size: 15px; color: var(--ink-3); margin: 0; }
.stepb { font-size: 19px; font-weight: 600; color: var(--ink); }
.ggrid { display: grid; gap: 14px; }
.ggrid figure { margin: 0; display: grid; gap: 8px; }
.ggrid figcaption { font-size: 14px; color: var(--ink-3); line-height: 1.35; }
.ggrid .gallery-img { aspect-ratio: 4/5; }
.pal { display: flex; gap: 8px; } .pal .sw { flex: 1; height: 46px; border-radius: 8px; border: 1px solid var(--card-line); }
.params { display: grid; gap: 0; }
.params > div { display: grid; grid-template-columns: 210px 1fr; gap: 16px; border-top: 1px solid var(--card-line); padding: 12px 0; font-size: 18px; color: var(--ink-2); }
.params code { font-family: var(--mono); color: var(--ink); font-size: 17px; }
.tear .stat strong { font-family: var(--serif); font-size: 56px; color: var(--ink); }
.press { display: grid; }
.press-row { display: grid; grid-template-columns: 150px 110px 1fr; grid-template-rows: auto auto; column-gap: 18px; border-top: 1px solid var(--card-line); padding: 14px 0; }
.press-row b { grid-column: 3; font-size: 20px; font-weight: 500; }
.press-row > span:last-child { grid-column: 3; color: var(--ink-3); font-size: 16px; }
.press-row .k { color: var(--ink-2); }
.mail { font-family: var(--serif); font-weight: 700; font-size: 44px; color: var(--ink); margin: 0; }
.stat strong { color: var(--ink); }
/* Lightbox */
.node.on img.media, .node.on img.gallery-img { cursor: zoom-in; }
.mwrap { position: relative; }
.expand { position: absolute; top: 14px; right: 14px; font-size: 15px; padding: 10px 16px; background: rgba(17,17,18,.82); }
#lb { position: fixed; inset: 0; z-index: 50; background: rgba(8,8,9,.95); display: grid; grid-template-rows: auto 1fr auto; gap: 12px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#lb[hidden] { display: none; }
#lb .lb-top { display: flex; justify-content: flex-end; }
#lb .lb-stage { display: grid; place-items: center; min-height: 0; }
#lb .lb-stage img, #lb .lb-stage video { max-width: calc(100vw - 32px); max-height: calc(100vh - 130px); object-fit: contain; border-radius: 10px; display: block; }
#lb .lb-cap { font-family: var(--mono); font-size: 13px; letter-spacing: .05em; color: var(--ink-2); text-align: center; text-transform: uppercase; }

/* HUD */
#hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(transparent, rgba(10,10,11,.85) 40%); pointer-events: none; }
#hud > * { pointer-events: auto; }
.brand { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
.brand b { color: var(--ink); font-weight: 500; }
.nav { display: flex; align-items: center; gap: 8px; }
.nav output { font-family: var(--mono); font-size: 12px; color: var(--ink-2); min-width: 15ch; text-align: center; text-transform: uppercase; letter-spacing: .06em; }
button { white-space: nowrap; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink); background: rgba(30,30,33,.9);
  border: 1px solid var(--card-line); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
button:hover { border-color: var(--pale); }
button:focus-visible { outline: 2px solid var(--pale); outline-offset: 2px; }
.tools { display: flex; gap: 8px; }

@media (prefers-reduced-motion: reduce) { .node { transition: none; } }
</style>

<script>
const A = "";
// Talk order. col/row place each node on a snake path; w is node width in canvas pixels.
const NODES = [
  { id: "hello", label: "Meg Ball · designer turned creative technologist", col: 0, row: 0, w: 1200, cls: "title-node", html: `
    <div class="intro">
      <img class="headshot" src="assets/people/meg-ball-headshot.jpg" alt="Meg Ball">
      <div style="display:grid;gap:22px;align-content:center">
        <h1>I make AI useful for the people who make <span class="acc">things.</span></h1>
        <p class="lede">Twenty years as a designer came first. Now I lead creative AI in fashion, moving tools out of the demo and into the work designers, merchants and studio teams do every week.</p>
        <div class="cta"><button type="button" onclick="window.go && go(1)">see how it's made →</button><span class="mono-mail">invite me to speak · megballcreates@gmail.com</span></div>
      </div>
    </div>
    <div class="row4"><div class="stat"><strong>20 yrs</strong><span>in design first</span></div><div class="stat"><strong>53+</strong><span>AI use cases validated</span></div><div class="stat"><strong>WWD</strong><span>cover, Aug 2026</span></div><div class="stat"><strong>17K</strong><span>following along</span></div></div>
    <p class="tag">it used to begin with a sketch. now it begins with a <span class="acc">conversation.</span></p>` },
  { id: "madhouse", label: "cut 01 · style → supply chain", col: 1, row: 0, w: 1300, html: `
    <h2>welcome to the <span class="acc">madhouse.</span></h2>
    <div class="split" style="grid-template-columns:0.7fr 1.5fr">
      <video class="media" src="madhouse.mp4" poster="assets/img/e91ce49c5b.jpg" controls playsinline preload="metadata" data-sound style="aspect-ratio:9/16;object-fit:cover" aria-label="Madhouse, episode 01"></video>
      <div style="display:grid;gap:20px;align-content:start">

const COL = 1450, ROWGAP = 220;

const world = document.getElementById("world"), vp = document.getElementById("viewport"), svg = document.getElementById("wires");
NODES.forEach((n, i) => {
  const el = document.createElement("section");
  el.className = "node " + (n.cls || ""); el.id = "n-" + n.id; el.style.width = n.w + "px"; el.tabIndex = 0;
  el.setAttribute("aria-label", n.label);
  el.innerHTML = `<div class="node-head"><span>${n.label}</span><span>···</span></div><div class="node-body">${n.html}</div>`;
  world.appendChild(el); n.el = el; n.i = i;
});

function layout() {
  const rows = {};
  NODES.forEach(n => { const h = n.el.offsetHeight; rows[n.row] = Math.max(rows[n.row] || 0, h); });
  let y = 0; const rowY = {};
  Object.keys(rows).sort((a, b) => a - b).forEach(r => { rowY[r] = y; y += rows[r] + ROWGAP; });
  NODES.forEach(n => {
    n.x = n.col * COL + (COL - 150 - n.w) / 2 + 75; n.y = rowY[n.row] + (rows[n.row] - n.el.offsetHeight) / 2;
    n.h = n.el.offsetHeight; n.el.style.left = n.x + "px"; n.el.style.top = n.y + "px";
  });
  drawWires();
}
var hotIdx = -1;
function hotWires(i) {
  hotIdx = i;
  svg.querySelectorAll("g").forEach(g => g.classList.toggle("hot", i >= 0 && (+g.dataset.a === i || +g.dataset.b === i)));
  svg.querySelectorAll("circle").forEach(c => c.classList.toggle("hot", i >= 0 && +c.dataset.n === i));
}
function drawWires() {
  let segs = "", dots = "";
  const links = [];
  for (let i = 0; i < NODES.length - 1; i++) links.push([NODES[i], NODES[i + 1]]);
  links.forEach(([a, b]) => {
    let p0, p3, c1, c2;
    if (a.row === b.row) {
      const fwd = b.x > a.x;
      p0 = [fwd ? a.x + a.w : a.x, a.y + a.h * .45]; p3 = [fwd ? b.x : b.x + b.w, b.y + b.h * .45];
      const dx = Math.max(120, Math.abs(p3[0] - p0[0]) * .5) * (fwd ? 1 : -1);
      c1 = [p0[0] + dx, p0[1]]; c2 = [p3[0] - dx, p3[1]];
    } else {
      p0 = [a.x + a.w / 2, a.y + a.h]; p3 = [b.x + b.w / 2, b.y];
      const dy = Math.max(120, (p3[1] - p0[1]) * .5); c1 = [p0[0], p0[1] + dy]; c2 = [p3[0], p3[1] - dy];
    }
    const d = `M${p0}C${c1} ${c2} ${p3}`, ia = NODES.indexOf(a), ib = NODES.indexOf(b);
    segs += `<g data-a="${ia}" data-b="${ib}"><path class="glow" d="${d}"/><path class="base" d="${d}"/><path class="flow" d="${d}"/></g>`;
    dots += `<circle data-n="${ia}" cx="${p0[0]}" cy="${p0[1]}" r="9"/><circle data-n="${ib}" cx="${p3[0]}" cy="${p3[1]}" r="9"/>`;
  });
  svg.innerHTML = segs + dots; hotWires(hotIdx);
}

// ---- camera
const cam = { x: 0, y: 0, s: .2 };
let anim = null, current = -1;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function apply() { world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.s})`; }
function bounds() {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  NODES.forEach(n => { x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + n.w); y1 = Math.max(y1, n.y + n.h); });
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}
function target(r, pad) {
  const vw = vp.clientWidth, vh = vp.clientHeight - 70;
  const s = Math.min((vw - pad * 2) / r.w, (vh - pad * 2) / r.h, 1.4);
  return { s, x: vw / 2 - (r.x + r.w / 2) * s, y: vh / 2 - (r.y + r.h / 2) * s };
}
function fly(t) {
  cancelAnimationFrame(anim);
  if (reduce) { Object.assign(cam, t); apply(); return; }
  const from = { ...cam }, start = performance.now(), dur = 850;
  const step = now => {
    const k = Math.min(1, (now - start) / dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    // dip the zoom slightly mid-flight so moves read as travel across the graph
    const dip = Math.sin(Math.PI * k) * .25 * Math.min(from.s, t.s);
    cam.s = from.s + (t.s - from.s) * e - dip; cam.x = from.x + (t.x - from.x) * e; cam.y = from.y + (t.y - from.y) * e;
    if (k < 1) { anim = requestAnimationFrame(step); } else { Object.assign(cam, t); }
    apply();
  };
  anim = requestAnimationFrame(step);
}
const where = document.getElementById("where");
function setMedia(on) {
  NODES.forEach(n => n.el.querySelectorAll("video").forEach(v => {
    if (n === on) { if (v.dataset.sound !== undefined) v.muted = false; v.play().catch(() => { v.muted = true; v.play().catch(() => {}); }); }
    else v.pause();
  }));
}
function focusNode(i, fromHash) {
  current = i; const n = NODES[i];
  NODES.forEach(m => m.el.classList.toggle("on", m === n)); hotWires(NODES.indexOf(n));
  fly(target({ x: n.x, y: n.y, w: n.w, h: n.h }, Math.min(60, vp.clientWidth * .04)));
  where.textContent = `${String(i + 1).padStart(2, "0")} / ${NODES.length} · ${n.label}`;
  setMedia(n);
  if (!fromHash && location.hash !== "#" + n.id) history.replaceState(null, "", "#" + n.id);
}
function overview() {
  current = -1; NODES.forEach(m => m.el.classList.remove("on")); hotWires(-1); setMedia(null);
  fly(target(bounds(), 40)); where.textContent = "Overview";
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}
document.getElementById("next").onclick = () => focusNode(Math.min(NODES.length - 1, current + 1));
document.getElementById("prev").onclick = () => current <= 0 ? overview() : focusNode(current - 1);
document.getElementById("overview").onclick = overview;
document.getElementById("full").onclick = () => {
  const d = document;
  try { d.fullscreenElement ? d.exitFullscreen() : d.documentElement.requestFullscreen().catch(() => {}); } catch (e) {}
};
addEventListener("keydown", e => {
  if (!lb.hidden) { if (e.key === "Escape") closeLB(); return; }
  if (e.target.closest && e.target.closest("video")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); focusNode(Math.min(NODES.length - 1, current + 1)); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); current <= 0 ? overview() : focusNode(current - 1); }
  else if (e.key === "Escape" || e.key === "o") overview();
});

// ---- pan, zoom, click-to-focus
const ptrs = new Map(); let drag = null, pinch = null;
vp.addEventListener("pointerdown", e => {
  if (e.target.closest("video, button, a")) return;
  vp.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cancelAnimationFrame(anim);
  if (ptrs.size === 1) drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y, moved: false, el: e.target.closest(".node"), t: e.target };
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: cam.s, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, cx: cam.x, cy: cam.y }; drag = null; }
});
vp.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], s = Math.max(.05, Math.min(2, pinch.s * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d));
    cam.x = pinch.mx - (pinch.mx - pinch.cx) * s / pinch.s; cam.y = pinch.my - (pinch.my - pinch.cy) * s / pinch.s; cam.s = s; apply();
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 6) { drag.moved = true; vp.classList.add("dragging"); }
    if (drag.moved) { cam.x = drag.cx + dx; cam.y = drag.cy + dy; apply(); }
  }
});
const end = e => {
  ptrs.delete(e.pointerId); vp.classList.remove("dragging");
  if (drag && !drag.moved && drag.el) {
    const i = NODES.findIndex(n => n.el === drag.el);
    if (i !== current) focusNode(i);
    else if (drag.t.matches && drag.t.matches("img.media, img.gallery-img")) openLB(drag.t);
  }
  if (ptrs.size < 2) pinch = null; drag = null;
};
vp.addEventListener("pointerup", end); vp.addEventListener("pointercancel", end);
vp.addEventListener("wheel", e => {
  e.preventDefault(); cancelAnimationFrame(anim);
  const k = Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), s = Math.max(.05, Math.min(2, cam.s * k));
  cam.x = e.clientX - (e.clientX - cam.x) * s / cam.s; cam.y = e.clientY - (e.clientY - cam.y) * s / cam.s; cam.s = s; apply();
}, { passive: false });
NODES.forEach((n, i) => n.el.addEventListener("keydown", e => { if (e.key === "Enter" && e.target === n.el) focusNode(i); }));

// ---- lightbox: click an image (or Expand on a video) in the focused node
const lb = document.getElementById("lb"), lbStage = document.getElementById("lb-stage"), lbCap = document.getElementById("lb-cap");
function openLB(src) {
  lbStage.innerHTML = "";
  let m;
  if (src.tagName === "VIDEO") {
    m = document.createElement("video"); m.src = src.currentSrc || src.src; m.controls = true; m.playsInline = true;
    m.currentTime = src.currentTime || 0; src.pause(); m.play().catch(() => { m.muted = true; m.play().catch(() => {}); });
  } else { m = document.createElement("img"); m.src = src.currentSrc || src.src; m.alt = src.alt || ""; }
  lbStage.appendChild(m); lbCap.textContent = src.getAttribute("aria-label") || src.alt || "";
  lb.hidden = false; document.getElementById("lb-close").focus();
}
function closeLB() { lbStage.querySelectorAll("video").forEach(v => v.pause()); lbStage.innerHTML = ""; lb.hidden = true; }
document.getElementById("lb-close").onclick = closeLB;
lb.addEventListener("click", e => { if (e.target === lb || e.target === lbStage) closeLB(); });
world.querySelectorAll("video.media").forEach(v => {
  const w = document.createElement("div"); w.className = "mwrap"; const ar = v.style.getPropertyValue("--ar"); if (ar) w.style.setProperty("--ar", ar); v.parentNode.insertBefore(w, v); w.appendChild(v);
  const b = document.createElement("button"); b.className = "expand"; b.textContent = "⤢ Expand"; b.setAttribute("aria-label", "Open video full screen");
  b.onclick = ev => { ev.stopPropagation(); openLB(v); }; w.appendChild(b);
});

window.go = i => focusNode(i);
// ---- boot
function boot() {
  layout();
  const i = NODES.findIndex(n => "#" + n.id === location.hash);
  Object.assign(cam, target(bounds(), 40)); apply();
  if (i >= 0) focusNode(i, true); else where.textContent = "Overview";
}
addEventListener("hashchange", () => { const i = NODES.findIndex(n => "#" + n.id === location.hash); if (i >= 0 && i !== current) focusNode(i, true); });
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { layout(); current >= 0 ? focusNode(current, true) : overview(); }, 150); });
world.querySelectorAll("img, video").forEach(m => m.addEventListener(m.tagName === "IMG" ? "load" : "loadedmetadata", () => { clearTimeout(rt); rt = setTimeout(() => { layout(); if (current >= 0) focusNode(current, true); else { Object.assign(cam, target(bounds(), 40)); apply(); } }, 120); }));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(boot);
</script>

</body>
